<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de los Carritos Hot Wheels 🚗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050b14;
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 1.5rem;
            color: #7df9ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(125, 249, 255, 0.5);
            z-index: 10;
        }
        .date {
            font-size: 1.1rem;
            color: #ff6f61;
            margin-bottom: 20px;
            font-weight: bold;
            z-index: 10;
        }
        .bouquet-container {
            position: relative;
            width: 300px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 20px;
            z-index: 10;
        }
        .bouquet-img {
            width: 250px;
            filter: drop-shadow(0 0 15px rgba(0, 150, 255, 0.6));
        }
        .card {
            background: rgba(15, 25, 45, 0.9);
            border: 2px solid #7df9ff;
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 0 20px rgba(125, 249, 255, 0.3);
            z-index: 10;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card p {
            font-size: 1.1rem;
            color: #ffffff;
        }
        /* Estrellas de fondo */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Feliz Día de los Carritos Hot Wheels 🚗💨</h1>
    <div class="date">30 / 09 / 2026 💙</div>

    <div class="bouquet-container">
        <!-- Simulación visual del ramo -->
        <div style="font-size: 80px;">💐🏎️</div>
    </div>

    <div class="card">
        <p id="message">Mi lugar feliz eres tú. Gracias por existir. ✨</p>
    </div>

    <script>
        // Mensajes románticos que cambian cada pocos segundos
        const messages = [
            "Mi lugar feliz eres tú. 💙",
            "Eres la casualidad más bonita. ✨",
            "Gracias por existir. 🚗",
            "Pienso en ti más de lo que imaginas. 🥺",
            "Me encantas de aquí a las estrellas. 🌟",
            "Contigo, cada día es especial. 💖",
            "Todo es mejor contigo a mi lado. 🏎️"
        ];

        let index = 0;
        const msgElement = document.getElementById("message");

        setInterval(() => {
            index = (index + 1) % messages.length;
            msgElement.style.opacity = 0;
            setTimeout(() => {
                msgElement.textContent = messages[index];
                msgElement.style.opacity = 1;
            }, 300);
        }, 3500);

        // Generar estrellitas en el fondo
        for (let i = 0; i < 50; i++) {
            let star = document.createElement("div");
            star.className = "star";
            star.style.top = Math.random() * 100 + "vh";
            star.style.left = Math.random() * 100 + "vw";
            star.style.width = Math.random() * 3 + "px";
            star.style.height = star.style.width;
            star.style.animationDuration = (Math.random() * 2 + 1) + "s";
            document.body.appendChild(star);
        }
    </script>
</body>
</html>
