<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: white;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pantalla de Carga */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .loader-car {
            font-size: 40px;
            margin-bottom: 20px;
            animation: bounce 1s infinite alternate;
        }

        .progress-bar-container {
            width: 80%;
            max-width: 300px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.1s linear;
        }

        .progress-text {
            margin-top: 10px;
            font-size: 18px;
            letter-spacing: 2px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Contenido Principal */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            width: 100%;
            padding: 20px;
            position: relative;
        }

        .message-box {
            background: rgba(18, 24, 38, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 20px;
        }

        .message-box h2 {
            font-size: 18px;
            color: #4facfe;
            margin-bottom: 10px;
        }

        .message-box p {
            font-size: 14px;
            color: #ddd;
        }

        /* Sección de Flores / Interactiva */
        .garden {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .flower {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #0b0f19;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.6);
            transition: transform 0.3s;
        }

        .flower:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Pantalla de carga -->
    <div id="loading-screen">
        <div class="loader-car">🏎️</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="bar"></div>
        </div>
        <div class="progress-text" id="counter">0%</div>
    </div>

    <!-- Contenido principal -->
    <div id="main-content">
        <div class="message-box">
            <h2>Para el amor de mi vida 🤍</h2>
            <p>Este regalo es para ti en este día muy especial (11.03). Gracias por existir en mi vida.</p>
        </div>

        <!-- Flores interactivas con las letras T-A-M-O (Te amo) -->
        <div class="garden">
            <div class="flower" onclick="alert('Te amo con todo mi corazón')">T</div>
            <div class="flower" onclick="alert('Eres mi lugar favorito')">A</div>
            <div class="flower" onclick="alert('Contigo todo tiene sentido')">M</div>
            <div class="flower" onclick="alert('Mi mayor casualidad')">O</div>
        </div>
    </div>

    <script>
        // Animación de la barra de carga
        let progress = 0;
        const bar = document.getElementById('bar');
        const counter = document.getElementById('counter');
        const loadingScreen = document.getElementById('loading-screen');
        const mainContent = document.getElementById('main-content');

        const interval = setInterval(() => {
            progress += 2;
            bar.style.width = progress + '%';
            counter.innerText = progress + '%';

            if (progress >= 100) {
                clearInterval(interval);
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    mainContent.style.display = 'flex';
                }, 800);
            }
        }, 30);
    </script>
</body>
</html>
